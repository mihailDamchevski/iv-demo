name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Start ToDo App
        run: |
          npm start &
          echo $! > app.pid

      - name: Wait for app
        run: |
          n=0
          until curl -sSf http://localhost:8080/todo || [ $n -ge 15 ]; do
            n=$((n+1))
            echo "Waiting for app to start..."
            sleep 2
          done

      - name: Run Playwright Tests
        run: |
          npx playwright test
        continue-on-error: true  # <-- continue even if tests fail

      - name: Generate Allure Report
        run: npm run report:allure:generate || true  # <-- never fail even if tests failed

      - name: Debug Allure output
        if: always()
        run: |
          echo "Allure report contents:"
          ls -la allure-report || echo "allure-report missing"

      # Upload only the Allure report for deployment
      - name: Upload Allure Report
        if: always()  # <-- always run, even if previous steps failed
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./allure-report

      # Upload other test artifacts (screenshots, videos, traces)
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-results/
            playwright-report/
            videos/
            screenshots/

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./allure-report

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

      - name: Print GitHub Pages URL
        run: |
          echo "Allure report deployed to:"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.repository }}/"
