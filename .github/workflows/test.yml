name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:      


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install

      # 5. Start app in background
      - name: Start ToDo App
        run: |
          npm start &
          echo $! > app.pid
      - name: Wait for app
        run: |
          n=0
          until curl -sSf http://localhost:8080/todo || [ $n -ge 15 ]; do
            n=$((n+1))
            echo "Waiting for app to start..."
            sleep 2
          done

      # 6. Run Playwright tests
      - name: Run Playwright Tests
        run: |
          npx playwright test
        continue-on-error: true

      # 7. Generate Allure report
      - name: Generate Allure Report
        run: npm run report:allure:generate 

      # 8. Upload Allure report and test artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            allure-report/
            playwright-report/
            videos/
            screenshots/

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download allure-report from previous job
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: playwright-artifacts
          path: ./allure-report

      # Deploy to GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
